{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h4>Users</h4>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search users...">
                </div>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush" id="usersList">
                    {% for user in users %}
                    <a href="#" class="list-group-item list-group-item-action user-item" data-user-id="{{ user.id }}">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-1">{{ user.full_name }}</h6>
                                <small class="text-muted">@{{ user.username }}</small>
                            </div>
                            <span class="badge {% if user.status == 'ONLINE' %}bg-success{% else %}bg-secondary{% endif %}">
                                {{ user.status }}
                            </span>
                        </div>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card">
            <div class="card-header" id="chatHeader">
                <h4>Select a user to start chatting</h4>
            </div>
            <div class="card-body">
                <div id="chatContainer" class="chat-container d-none">
                    <!-- Messages will be loaded here -->
                </div>
                <div class="input-group mt-3 d-none" id="messageInputGroup">
                    <input type="text" class="form-control" id="messageInput" placeholder="Type your message...">
                    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentChatUserId = null;
const socket = io();

socket.on('connect', () => {
    console.log('Connected to Socket.IO server');
});

socket.on('new_message', function(message) {
    if (currentChatUserId && 
        ((message.sender_id === currentUserId && message.receiver_id === parseInt(currentChatUserId)) ||
         (message.sender_id === parseInt(currentChatUserId) && message.receiver_id === currentUserId))) {
        
        const container = document.getElementById('chatContainer');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${message.sender_id === currentUserId ? 'sent' : 'received'}`;
        messageDiv.innerHTML = `
            ${message.content}
            <small class="d-block">${new Date(message.timestamp).toLocaleString()}</small>
        `;
        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
        
        // Play sound for received messages
        if (message.sender_id !== currentUserId) {
            playNotificationSound();
        }
    }
});

socket.on('user_status', function(data) {
    const userItem = document.querySelector(`.user-item[data-user-id="${data.user_id}"]`);
    if (userItem) {
        const statusBadge = userItem.querySelector('.badge');
        statusBadge.className = `badge ${data.status === 'ONLINE' ? 'bg-success' : 'bg-secondary'}`;
        statusBadge.textContent = data.status;
    }
});

// Search functionality
document.getElementById('searchInput').addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const userItems = document.getElementsByClassName('user-item');
    
    Array.from(userItems).forEach(item => {
        const username = item.querySelector('small').textContent.toLowerCase();
        const fullName = item.querySelector('h6').textContent.toLowerCase();
        
        if (username.includes(searchTerm) || fullName.includes(searchTerm)) {
            item.style.display = '';
        } else {
            item.style.display = 'none';
        }
    });
});

// Handle user selection
document.querySelectorAll('.user-item').forEach(item => {
    item.addEventListener('click', function(e) {
        e.preventDefault();
        const userId = this.dataset.userId;
        const userName = this.querySelector('h6').textContent;
        
        // Update UI
        document.querySelectorAll('.user-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
        
        // Show chat interface
        document.getElementById('chatHeader').innerHTML = `<h4>Chat with ${userName}</h4>`;
        document.getElementById('chatContainer').classList.remove('d-none');
        document.getElementById('messageInputGroup').classList.remove('d-none');
        
        // Load chat history
        currentChatUserId = userId;
        loadMessages(userId);
    });
});

function loadMessages(userId) {
    fetch(`/api/messages/${userId}`)
        .then(response => response.json())
        .then(messages => {
            const container = document.getElementById('chatContainer');
            container.innerHTML = messages.map(msg => `
                <div class="message ${msg.sender_id === currentUserId ? 'sent' : 'received'}">
                    ${msg.content}
                    <small class="d-block">${new Date(msg.timestamp).toLocaleString()}</small>
                </div>
            `).join('');
            scrollToBottom();
        });
}

function appendMessage(msg) {
    const container = document.getElementById('chatContainer');
    if (!container) return;
    
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${msg.sender_id === currentUserId ? 'sent' : 'received'}`;
    messageDiv.innerHTML = `
        ${msg.content}
        <small class="d-block">${new Date(msg.timestamp).toLocaleString()}</small>
    `;
    container.appendChild(messageDiv);
    scrollToBottom();
    
    // Play notification sound if message is received
    if (msg.sender_id !== currentUserId) {
        playNotificationSound();
    }
}

function playNotificationSound() {
    const audio = new Audio('/static/notification.mp3');
    audio.play().catch(e => console.log('Error playing sound:', e));
}

function sendMessage() {
    if (!currentChatUserId) return;
    
    const input = document.getElementById('messageInput');
    const content = input.value.trim();
    
    if (!content) return;
    
    // Clear input ngay lập tức để UX tốt hơn
    input.value = '';
    
    socket.emit('send_message', {
        content: content,
        receiver_id: currentChatUserId
    });
}

document.getElementById('messageInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
});

// Store current user ID for message handling
const currentUserId = {{ current_user.id }};

// Thêm xử lý lỗi
socket.on('message_error', function(data) {
    alert('Error sending message: ' + data.error);
});

// Thêm hàm mới để cuộn xuống dưới cùng
function scrollToBottom() {
    const container = document.getElementById('chatContainer');
    if (container) {
        container.scrollTop = container.scrollHeight;
    }
}
</script>
{% endblock %}
