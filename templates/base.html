<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: 60vh;
            overflow-y: auto;
            padding: 15px;
        }
        .message {
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }
        .sent {
            background-color: #007bff;
            color: white;
            margin-left: auto;
        }
        .received {
            background-color: #e9ecef;
            margin-right: auto;
        }
        .user-item {
            transition: all 0.3s;
        }
        .user-item:hover {
            background-color: #f8f9fa;
        }
        .user-item.active {
            background-color: #e9ecef;
        }
        .list-group-flush .list-group-item {
            border-right: 0;
            border-left: 0;
        }
        #usersList {
            max-height: 70vh;
            overflow-y: auto;
        }
        .connection-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #dc3545;
        }
        .socket-connected .connection-status {
            background-color: #28a745;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const socketOptions = {
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 1000,
                timeout: 20000
            };
            
            window.socket = io(window.location.origin, socketOptions);
            
            socket.on('connect', function() {
                console.log('Connected to Socket.IO server');
                document.body.classList.add('socket-connected');
            });
            
            socket.on('disconnect', function() {
                console.log('Disconnected from Socket.IO server');
                document.body.classList.remove('socket-connected');
                setTimeout(() => {
                    socket.connect();
                }, 1000);
            });
            
            socket.on('connect_error', function(error) {
                console.log('Connection error:', error);
            });
        });
    </script>
</head>
<body>
    <div class="connection-status"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Chat App</a>
            {% if current_user.is_authenticated %}
            <div class="navbar-nav ms-auto">
                <span class="nav-item nav-link">{{ current_user.username }}</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>
    
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
